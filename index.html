<script>
(function () {
  // ===== 1. 判断是否为手机端 =====
  var ua = navigator.userAgent || '';
  var isMobile =
    /Android|iPhone|iPod|iPad|HarmonyOS|Mobile|Windows Phone|BlackBerry|Opera Mini|IEMobile/i.test(ua) ||
    (navigator.maxTouchPoints > 1 && Math.min(screen.width, screen.height) < 820);

  if (isMobile) return; // 手机端：完全不受影响

  // ===== 2. 先隐藏原页面，避免内容闪现 =====
  document.documentElement.style.visibility = 'hidden';

  var MAINTENANCE_HTML = `
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width,initial-scale=1">
      <title>网站维护中</title>
      <style>
        :root{
          --bg:#0b0e14;
          --card:rgba(255,255,255,.035);
          --line:rgba(255,255,255,.09);
          --text:#e8ecf3;
          --sub:#8b95a7;
          --accent:#5b8cff;
        }
        *{margin:0;padding:0;box-sizing:border-box}
        html,body{background:var(--bg)}
        body{
          min-height:100vh;display:flex;align-items:center;justify-content:center;
          padding:24px;color:var(--text);
          background:
            radial-gradient(620px 420px at 50% -12%, rgba(91,140,255,.18), transparent 70%),
            radial-gradient(520px 420px at 108% 112%, rgba(126,87,255,.12), transparent 70%),
            var(--bg);
          font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
          -webkit-font-smoothing:antialiased;
        }
        .card{
          width:100%;max-width:480px;padding:52px 44px 42px;text-align:center;
          background:var(--card);border:1px solid var(--line);border-radius:20px;
          box-shadow:0 24px 64px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.06);
          backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
        }
        .icon{
          width:64px;height:64px;margin:0 auto 26px;border-radius:18px;
          display:flex;align-items:center;justify-content:center;color:var(--accent);
          background:rgba(91,140,255,.10);border:1px solid rgba(91,140,255,.25);
          box-shadow:0 0 36px rgba(91,140,255,.20);
        }
        h1{font-size:22px;font-weight:600;letter-spacing:.5px}
        .desc{margin-top:10px;font-size:14px;color:var(--sub);line-height:1.8}

        /* 维护进行中状态条 */
        .status{
          display:inline-flex;align-items:center;gap:8px;margin-top:28px;
          padding:9px 18px;border-radius:999px;
          background:rgba(91,140,255,.10);border:1px solid rgba(91,140,255,.25);
          font-size:13px;color:#a9c0ff;letter-spacing:.3px;
        }
        .dot{
          width:7px;height:7px;border-radius:50%;background:var(--accent);
          animation:pulse 1.8s ease-out infinite;
        }
        @keyframes pulse{
          0%{box-shadow:0 0 0 0 rgba(91,140,255,.55)}
          70%{box-shadow:0 0 0 9px rgba(91,140,255,0)}
          100%{box-shadow:0 0 0 0 rgba(91,140,255,0)}
        }

        .note{margin-top:26px;font-size:13px;color:var(--sub)}
        .foot{margin-top:6px;font-size:13px;color:var(--sub)}
        .foot a{color:var(--accent);text-decoration:none}
        .foot a:hover{text-decoration:underline}
        @media (max-width:420px){
          .card{padding:40px 24px 32px}
        }
      </style>
    </head>
    <body>
      <div class="card">
        <div class="icon">
          <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor"
               stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
          </svg>
        </div>

        <h1>网站正在维护中</h1>
        <p class="desc">我们正在进行系统升级，<br>完成后即可正常访问，敬请谅解。</p>

        <div class="status"><span class="dot"></span>维护进行中</div>

        <p class="note">手机端访问不受影响</p>
        <p class="foot">手机端访问不受影响 <a href="mailto:手机端访问不受影响">手机端访问不受影响</a></p>
      </div>
    </body>
  `;

  function render() {
    document.documentElement.innerHTML = MAINTENANCE_HTML;
    document.documentElement.style.visibility = 'visible';
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', render);
  } else {
    render();
  }
})();
</script>

    /* ============================================================

    :root {
      --bg: #0A0D14;
      --card: #171A23;
      --card-hover: #1D2129;
      --line: rgba(255, 255, 255, 0.07);

      --ghost-line: rgba(255, 255, 255, 0.14);
      --ghost-hover: rgba(255, 255, 255, 0.05);
      --tool-bg: rgba(255, 255, 255, 0.045);
      --tool-line: rgba(255, 255, 255, 0.08);
      --avatar-bg: #1A1E2B;
      --toast-bg: #242A38;
      --toast-line: rgba(255, 255, 255, 0.1);
      --glow-warm: rgba(168, 74, 132, 0.30);
      --glow-cool: rgba(124, 92, 255, 0.19);
      --card-shadow: none;
    }
    html[data-theme="light"] {
      --bg: #F5F6FA;
      --card: #FFFFFF;
      --card-hover: #FFFFFF;
      --line: rgba(16, 20, 32, 0.08);
      --line-hover: rgba(16, 20, 32, 0.18);
      --fg: #141821;
      --muted: #6B7280;
      --chev: #A7ADBA;
      --accent: #6A46F5;
      --accent-hover: #7C5CFF;
      --ghost-line: rgba(16, 20, 32, 0.14);
      --ghost-hover: rgba(16, 20, 32, 0.04);
      --tool-bg: rgba(16, 20, 32, 0.035);
      --tool-line: rgba(16, 20, 32, 0.08);
      --avatar-bg: #E7E9F0;
      --toast-bg: #1B2030;
      --toast-line: rgba(255, 255, 255, 0.12);
      --glow-warm: rgba(168, 74, 132, 0.10);
      --glow-cool: rgba(124, 92, 255, 0.09);
      --card-shadow: 0 1px 2px rgba(16, 20, 32, 0.05);
    }

    html, body { background: var(--bg); }
    body {
      color: var(--fg);
      padding: 0 16px calc(40px + env(safe-area-inset-bottom));
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;

    /* 底部极淡紫色辉光：对齐截图采样（左 #1B1320 偏洋红 / 右 #1A172C 偏紫），

    .tools { display: flex; align-items: center; gap: 8px; margin-top: 16px; }

      .card:hover .chev { transform: none; }
    }
  </style>

      var lum = (0.2126 * c.r + 0.7152 * c.g + 0.0722 * c.b) / 255;
      if (lum < 0.16) return 'rgba(120,128,150,0.16)';
      return 'rgba(' + c.r + ',' + c.g + ',' + c.b + ',0.20)';
    }

    function iconOf(card) {
      return ICON_SET[card.title] || ICON_SET.__fallback;
    }

    /* ---------------- DOM 引用 ---------------- */
    var listEl = document.getElementById('list');
    var emptyEl = document.getElementById('empty');
    var toolsEl = document.getElementById('tools');
    var searchWrap = document.getElementById('searchWrap');
    var searchInput = document.getElementById('searchInput');
    var searchBtn = document.getElementById('searchBtn');
    var themeBtn = document.getElementById('themeBtn');
    var filterBar = document.getElementById('filterBar');
    var filterCount = document.getElementById('filterCount');
    var clearBtn = document.getElementById('clearBtn');
    var emptyReset = document.getElementById('emptyReset');
    var subscribeBtn = document.getElementById('subscribeBtn');
    var shareBtn = document.getElementById('shareBtn');
    var toastEl = document.getElementById('toast');
    var cardNodes = [];

    /* ---------------- 页头 ---------------- */
    function renderHero() {
      document.getElementById('siteName').textContent = SITE.name;
      document.getElementById('siteHandle').textContent = SITE.handle;
      document.getElementById('siteBio').textContent = SITE.bio;
      document.getElementById('siteStats').innerHTML = SITE.stats.map(function (item) {
        return '<span><b>' + escapeAttr(item.num) + '</b> ' + escapeAttr(item.label) + '</span>';
      }).join('<span class="sep" aria-hidden="true">·</span>');
      mountAvatar();
    }

    // 头像：avatarUrl 非空时用 <img> 替换几何 SVG；先预加载，失败就保持内置 SVG
    function mountAvatar() {
      var avatarEl = document.getElementById('avatar');
      var url = String(SITE.avatarUrl || '').trim();
      if (!url) return;
      var probe = new Image();
      probe.referrerPolicy = 'no-referrer';
      probe.onload = function () {
        var img = document.createElement('img');
        img.src = url;
        img.alt = SITE.name;
        img.referrerPolicy = 'no-referrer';
        img.setAttribute('style', 'width:100%;height:100%;object-fit:cover;border-radius:50%;display:block');
        avatarEl.innerHTML = '';
        avatarEl.appendChild(img);
      };
      probe.onerror = function () { /* 加载失败：保留内置几何头像，不出现破图 */ };
      probe.src = url;
    }

    /* ---------------- 卡片 ---------------- */
    function cardHTML(card, index) {
      return '' +
        '<button class="card" type="button" data-i="' + index + '"' +
          ' aria-label="' + escapeAttr(card.title + '，' + card.sub) + '">' +
          '<span class="ico" style="background:' + escapeAttr(tintOf(card.brand)) +
            ';color:' + escapeAttr(card.ink) + '">' +
            '<span class="ico-fb">' + iconOf(card) + '</span>' +
          '</span>' +
          '<span class="txt">' +
            '<span class="ttl">' + escapeAttr(card.title) + '</span>' +
            '<span class="sub">' + escapeAttr(card.sub) + '</span>' +
          '</span>' +
          '<span class="chev">' + SVG_CHEV + '</span>' +
        '</button>';
    }

    function renderList() {
      listEl.innerHTML = CARDS.map(cardHTML).join('');
      cardNodes = Array.prototype.slice.call(listEl.children);
      // 逐个挂自定义图标（iconUrl 为空就什么都不做，保留内置 SVG）
      cardNodes.forEach(function (node, i) {
        mountIcon(node.querySelector('.ico'), CARDS[i]);
      });
    }

    // 自定义图标：内置 SVG 先留着当兜底，图片真正 load 成功才隐藏它；
    // onerror 时把 img 整个移除 → 永远回退到内置 SVG，绝不出现破图图标。
    function mountIcon(icoEl, card) {
      if (!icoEl) return;
      var url = String(card.iconUrl || '').trim();
      if (!url) return;

      var fallback = icoEl.querySelector('.ico-fb');
      var img = document.createElement('img');
      img.alt = '';
      img.loading = 'lazy';
      img.referrerPolicy = 'no-referrer';
      img.setAttribute('referrerpolicy', 'no-referrer');
      img.setAttribute('style', 'width:100%;height:100%;object-fit:contain;padding:6px;box-sizing:border-box');

      img.onload = function () {
        if (fallback) fallback.style.display = 'none';
      };
      img.onerror = function () {
        if (img.parentNode) img.parentNode.removeChild(img);
        if (fallback) fallback.style.display = '';
      };

      img.src = url;
      icoEl.appendChild(img);
    }

    /* ---------------- 搜索过滤 ---------------- */
    function applyFilter() {
      var q = searchInput.value.trim().toLowerCase();
      var shown = 0;
      CARDS.forEach(function (card, i) {
        var node = cardNodes[i];
        if (!node) return;
        var hit = !q || (card.title + ' ' + card.sub + ' ' + card.keys).toLowerCase().indexOf(q) > -1;
        node.hidden = !hit;
        if (hit) shown += 1;
      });
      filterCount.textContent = '匹配 ' + shown + ' 个 / 共 ' + CARDS.length + ' 个';
      emptyEl.hidden = shown > 0 || !q;
    }

    function setSearchOpen(open) {
      toolsEl.classList.toggle('is-open', open);
      searchBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
      searchInput.tabIndex = open ? 0 : -1;
      filterBar.hidden = !open;
      if (open) {
        window.setTimeout(function () { searchInput.focus(); }, 80);
      } else {
        searchInput.value = '';
      }
      applyFilter();
    }

    /* ---------------- toast ---------------- */
    var toastTimer = null;
    function toast(message) {
      toastEl.textContent = message;
      toastEl.classList.add('show');
      window.clearTimeout(toastTimer);
      toastTimer = window.setTimeout(function () {
        toastEl.classList.remove('show');
      }, 2200);
    }

    /* ---------------- 主题 ---------------- */
    function setTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      var isLight = theme === 'light';
      themeBtn.setAttribute('aria-pressed', isLight ? 'true' : 'false');
      themeBtn.setAttribute('aria-label', isLight ? '切换到深色主题' : '切换到浅色主题');
    }

    /* ---------------- 事件 ---------------- */
    // 卡片点击：有 url 就新开页签，没有就提示
    listEl.addEventListener('click', function (event) {
      var node = event.target && event.target.closest ? event.target.closest('.card') : null;
      if (!node) return;
      var card = CARDS[Number(node.getAttribute('data-i'))];
      if (!card) return;
      if (card.url) {
        window.open(card.url, '_blank', 'noopener');
      } else {
        toast('这个卡片还没配置链接');
      }
    });

    searchBtn.addEventListener('click', function () {
      setSearchOpen(!toolsEl.classList.contains('is-open'));
    });
    searchInput.addEventListener('input', applyFilter);
    searchInput.addEventListener('keydown', function (event) {
      if (event.key === 'Escape' || event.key === 'Esc') setSearchOpen(false);
    });
    clearBtn.addEventListener('click', function () {
      searchInput.value = '';
      applyFilter();
      searchInput.focus();
    });
    emptyReset.addEventListener('click', function () {
      searchInput.value = '';
      applyFilter();
      searchInput.focus();
    });

    themeBtn.addEventListener('click', function () {
      var next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
      setTheme(next);
    });

    var subscribed = false;
    subscribeBtn.addEventListener('click', function () {
      subscribed = !subscribed;
      subscribeBtn.classList.toggle('is-on', subscribed);
      subscribeBtn.setAttribute('aria-pressed', subscribed ? 'true' : 'false');
      subscribeBtn.querySelector('.btn-label').textContent = subscribed ? '已订阅' : '订阅更新';
      toast(subscribed ? '已订阅 Luna Chen 的更新' : '已取消订阅');
    });

    shareBtn.addEventListener('click', function () {
      var url = window.location.href;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(function () {
          toast('主页链接已复制');
        }, copyFallback);
      } else {
        copyFallback();
      }
    });

    function copyFallback() {
      var ta = document.createElement('textarea');
      ta.value = window.location.href;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.top = '-1000px';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (err) { ok = false; }
      document.body.removeChild(ta);
      toast(ok ? '主页链接已复制' : '复制失败，请手动复制地址栏链接');
    }

    /* ---------------- 启动 ---------------- */
    setTheme('dark');       // 默认深色（不写本地存储，刷新回默认）
    renderHero();
    renderList();
    setSearchOpen(false);
    applyFilter();
  })();
  </script>
  <!-- [/PAGE:SCRIPT] -->
</body>
</html>
